spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.thymeleaf.cache=false
# Okta/OAuth2 is not needed for tests: use dummy values and skip Okta auto-configuration
# so the context does not try to fetch the OIDC discovery document from a real issuer.
okta.oauth2.issuer=https://example.invalid/oauth2/default
okta.oauth2.client-id=test-client-id
okta.oauth2.client-secret=test-client-secret
spring.autoconfigure.exclude=com.okta.spring.boot.oauth.OktaOAuth2AutoConfig,com.okta.spring.boot.oauth.OktaOAuth2ResourceServerAutoConfig
